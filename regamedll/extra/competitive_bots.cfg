// Initial ReGameDLL 1.6 Competitive bot port. Execute from a server-owned config.
// Enable bot_enable in game_init.cfg before loading the game DLL's bot system.
bot_competitive 1
bot_team_orders 1
bot_text_chat 1
bot_round_chat 1

// The backend must supply the match roster and quota.
bot_quota 0
bot_quota_mode normal
bot_auto_vacate 0
bot_join_after_player 0
bot_difficulty 1
bot_allow_shield 0
bot_chatter radio

// competitive_match_id, competitive_match_live, competitive_match_completed,
// and competitive_bot_buy_epoch are owned by the backend/AMXX core.
// Do not reset them here or infer the final match state from round scores.

// Optional external DeepSeek sidecar; no key belongs in game cvars.
bot_ai_bridge 0
// Linux dedicated only, requires the query companion launcher.
bot_enable_query_hook 0

// Simulated scoreboard ping, independent of query replies or AI.
bot_show_latency 1
bot_ping_min 20
bot_ping_max 60

// Use the 1.6 Competitive core's team-only Mouse3-style enemy markers.
bot_ping_comms 1

// Native team plans and last-seen utility.
bot_captain_mode 1
bot_smart_grenades 1

// Favor strafing fire with SMGs and close-range shotguns.
bot_combat_movement 1

// Five-level execution (-1 follows native difficulty); coordinated support/economy.
bot_competitive_difficulty -1
bot_advanced_tactics 1
bot_lagging_bot_percent 15
bot_medium_ping_bot_percent 25
